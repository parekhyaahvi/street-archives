<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBRANT | Access Portal</title>
  <meta name="description" content="Log in or create a VIBRANT streetwear account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  
  <style>
    .auth-section {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      position: relative;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .auth-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-bottom-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border-bottom: 2px solid transparent;
    }

    .auth-tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--pink);
    }

    .auth-form {
      display: none;
      flex-direction: column;
    }

    .auth-form.active {
      display: flex;
      animation: fadeInForm 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      will-change: opacity, transform;
    }

    @keyframes fadeInForm {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      margin-top: 16px;
    }

    .oauth-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--pink);
    }

    .oauth-btn svg {
      width: 18px;
      height: 18px;
    }

    .forgot-link {
      font-size: 12px;
      color: var(--text-secondary);
      align-self: flex-end;
      margin-top: -8px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .forgot-link:hover {
      color: var(--pink);
    }
  </style>
</head>
<body>

  <!-- Sticky Navbar -->
  <nav class="navbar" id="site-navbar">
    <div class="container navbar-container">
      <a href="/" class="nav-logo">Vibrant</a>
      <ul class="nav-links">
        <li><a href="/catalog.html">Shop</a></li>
        <li><a href="#" class="coming-soon">Lookbook</a></li>
        <li><a href="#" class="coming-soon">Editorial</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-icon" id="theme-toggle-btn" aria-label="Toggle Theme"></button>
        <a href="/cart.html" class="nav-icon cart-btn-container" id="nav-cart-btn" aria-label="View Shopping Cart">
          <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="20" width="20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cart-badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="container auth-section">
    <div class="ambient-glow" style="top: 20%; left: 50%; transform: translateX(-50%); width: 350px; height: 350px;"></div>
    
    <div class="card auth-container">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</div>
        <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</div>
      </div>

      <!-- Login form -->
      <form class="auth-form active" id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" required placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
            <button type="button" class="eye-toggle" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <!-- Forgot Password configured with coming-soon to toast placeholder (Q4) -->
        <a href="#" class="forgot-link coming-soon" id="login-forgot">Forgot Password?</a>
        
        <button type="submit" class="btn btn-primary" id="login-submit-btn">ACCESS ARCHIVES</button>
        
        <div style="text-align: center; margin: 16px 0; font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">OR</div>
        
        <!-- Continue with Google button configured with coming-soon to toast placeholder (Q4) -->
        <button type="button" class="oauth-btn coming-soon" id="login-google">
          <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 488 512" xmlns="http://www.w3.org/2000/svg">
            <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"></path>
          </svg>
          CONTINUE WITH GOOGLE
        </button>
      </form>

      <!-- Register form -->
      <form class="auth-form" id="register-form">
        <div class="form-group">
          <label class="form-label" for="register-name">Full Name</label>
          <input type="text" id="register-name" class="form-input" required placeholder="YOUR FULL NAME">
        </div>
        <div class="form-group">
          <label class="form-label" for="register-email">Email Address</label>
          <input type="email" id="register-email" class="form-input" required placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="register-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="register-password" class="form-input" required minlength="6" placeholder="MINIMUM 6 CHARACTERS">
            <button type="button" class="eye-toggle" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary" id="register-submit-btn">CREATE ARCHIVE PASS</button>
      </form>
    </div>
  </main>

  <script src="/js/ui.js"></script>
  <script>
    // Tab toggler switcher logic
    function switchTab(tab) {
      document.querySelectorAll(".auth-tab").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".auth-form").forEach(el => el.classList.remove("active"));
      
      if (tab === "login") {
        document.getElementById("tab-login").classList.add("active");
        document.getElementById("login-form").classList.add("active");
      } else {
        document.getElementById("tab-register").classList.add("active");
        document.getElementById("register-form").classList.add("active");
      }
    }

    // Handles API requests submission
    document.addEventListener("DOMContentLoaded", () => {
      // Clear URL params after parsing redirects
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get("redirect") || "/";

      // 1. Login Logic
      const loginForm = document.getElementById("login-form");
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!res.ok) {
            window.showToast(data.message || "Invalid credentials. Access Denied.");
            return;
          }

          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          
          window.showToast("ACCESS GRANTED. Welcome to VIBRANT.");
          
          setTimeout(() => {
            window.location.href = redirect;
          }, 1000);
        } catch (err) {
          console.error("Login process error:", err);
          window.showToast("Connection to archives failed.");
        }
      });

      // 2. Register Logic
      const registerForm = document.getElementById("register-form");
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("register-name").value;
        const email = document.getElementById("register-email").value;
        const password = document.getElementById("register-password").value;

        try {
          const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password })
          });
          const data = await res.json();
          if (!res.ok) {
            window.showToast(data.message || "Registration failed. Try again.");
            return;
          }

          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));

          window.showToast("ACCOUNT CREATED. Access granted.");

          setTimeout(() => {
            window.location.href = redirect;
          }, 1000);
        } catch (err) {
          console.error("Registration process error:", err);
          window.showToast("Connection to archives failed.");
        }
      });
    });
  </script>
</body>
</html>
